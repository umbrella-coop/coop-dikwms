# DDD Bounded-Context Organization

> Applies to directory layout, component ids, feature organization, and
> generated artefacts. Normative source:
> docs/brainstorm/ddd-bounded-contexts.md (approved 2026-08-07).

## Context Map (v2 — orchestrator-approved 2026-08-07)

| Context | Backend container | Frontend namespace |
|---|---|---|
| Data Graph | `data-graph` (SPEC-020 rename) | `ui/data-graph/` |
| Governance | moderation + audit | `data-graph-governance/` (reserved) |
| IAM | Policy | `iam/` (reserved) |
| Data Schema Registry | `schema-registry` | `data-schema-registry/` (reserved) |
| App Shell | `api` (transport) | `app/diwkms` |

## Directory Rule

- Frontend visual components + hooks: `ui/<context>/<component>` — e.g.
  `ui/data-graph/canvas`, `ui/data-graph/select-layout`.
- Hooks live in their owning context with a `hook-` prefix:
  `ui/data-graph/hook-use-event-stream`.
- App shells: `app/<shell>` — e.g. `app/diwkms`.
- Reserved namespaces are created when their first component lands.
- Backend: crates are the context containers (data-graph rename via SPEC-020).
- Anti-corruption: the API is a translation layer; components communicate via
  interfaces, never direct cross-context imports.

## Naming Rule

- Component ids: `<context>/<component>` kebab-case (e.g. `data-graph/canvas`).
- `data-testid`: context-prefixed kebab-case, intent-descriptive (e.g.
  `graph-select-layout`; prefixes `graph-`, `entity-`, `iam-`, `schema-`, `app-`).
- Conventions apply to NEW artefacts; incremental migration for existing
  (selectors are a stable contract).

## Generated Artefacts

- Boilerplate generators (e.g. `bit create react`) produce generic output;
  a **post-create lint** validates conformance (selectors, layout, specs)
  until generator customization is justified (10+ components).

## Ubiquitous Language (glossary stub)

node · edge · combo · property set · scope instance · change request ·
promotion · namespace · bounded context — one canonical term per concept;
synonyms documented in the glossary.

## Verification

- `frontend/check-layout.mjs` enforces context-first directories.
- Context map is referenced by ADRs (docs/adr/).
