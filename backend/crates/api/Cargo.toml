[package]
name = "api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
knowledge-domain = { path = "../knowledge-domain" }
terminusdb-repository = { path = "../terminusdb-repository" }
schema-registry = { path = "../schema-registry" }
stream-api = { path = "../stream-api" }
terminusdb-client = { path = "../../../third_party/terminusdb-rs/crates/client" }
axum = { version = "0.8", features = ["query", "json", "macros"] }
tokio = { version = "1", features = ["full"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.2"
chrono.workspace = true
utoipa = { version = "5", features = ["uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

[dev-dependencies]
terminusdb-bin = { path = "../../../third_party/terminusdb-rs/crates/bin" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
