[workspace]
resolver = "2"
members = ["crates/knowledge-domain", "crates/terminusdb-repository", "crates/schema-registry"]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
uuid = { version = "1", features = ["v4", "v7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Fast dev builds / test binaries (mirrors third_party/terminusdb-rs)
[profile.dev]
opt-level = 0
debug = 1
codegen-units = 256

[profile.dev.package."*"]
opt-level = 2
